<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIPEMA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f5f5f5;
      }
      .navbar {
        background-color: #0f2b52;
        padding: 20px;
      }
      .navbar-brand {
        color: white;
        font-size: 28px;
        font-weight: bold;
      }
      .dropdown-section {
        background-color: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        max-width: 1000px;
        margin: 40px auto;
      }
      .search-box {
        border: 1px solid #0f2b52;
        border-radius: 8px;
        padding: 6px 12px;
        display: flex;
        align-items: center;
      }
      .form-select,
      .form-control {
        border: 1px solid #0f2b52;
        border-radius: 8px;
      }
      .input-group-text {
        background: transparent;
        border: none;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Form Filter -->
    <div class="dropdown-section">
      <div class="container">
        <div class="row g-4">
          <div class="col-md-4">
            <label class="form-label">Mata Kuliah</label>
            <select class="form-select">
              <option selected disabled>Pilih Mata Kuliah</option>
              <option>Layanan Web</option>
              <option>Sistem Operasi</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Kelas</label>
            <select class="form-select">
              <option selected disabled>Pilih Kelas</option>
              <option>A</option>
              <option>B</option>
              <option>C</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Cari</label>
            <div class="input-group search-box">
              <input
                type="text"
                class="form-control border-0"
                placeholder="Cari berdasarkan NIM atau Nama"
              />
              <span class="input-group-text">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="#0f2b52"
                  class="bi bi-search"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242 1.1a5.5 5.5 0 1 1 0-11.001 5.5 5.5 0 0 1 0 11z"
                  />
                </svg>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Script untuk memuat navbar -->
    <script>
      fetch("navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar-container").innerHTML = data;
        });
    </script>
  </body>
</html>
