<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPEMA - Mahasiswa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/a2d9a66df5.js"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Segoe UI", sans-serif;
      }

      header {
        background-color: #0f2b52;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
      }

      .logo {
        font-size: 28px;
        font-weight: bold;
      }

      .user-section {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .circle-icon {
        width: 50px;
        height: 50px;
        background-color: #dce8f9;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .circle-icon img {
        width: 24px;
        height: 24px;
      }

      .user-text {
        font-size: 20px;
        font-weight: 500;
        color: #ffffff;
      }

      .divider {
        height: 40px;
        width: 2px;
        background-color: #dce8f9;
        transform: rotate(90deg);
      }

      .logout-link {
        text-decoration: none;
      }

      .content-container {
        padding: 2rem;
      }

      .info-card {
        background-color: white;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.05);
        padding: 1.5rem;
        position: relative;
        display: flex;
        justify-content: space-between;
        margin-bottom: 2rem;
      }

      .info-left,
      .info-right {
        flex: 1;
      }

      .status-akademik {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        text-align: right;
      }

      .badge-aktif {
        background-color: #4caf50;
        color: white;
        padding: 0.4rem 0.8rem;
        font-size: 0.9rem;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .table-header-custom {
  background-color: #e9ecef; /* Abu-abu Bootstrap */
  color: #212529;
}
.select-container {
  background-color: white;
  padding: 1.5rem;
  border-radius: 10px;
  margin-bottom: 2rem;
  box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.05);
}

#tahunAkademik {
  background-color: white;
}

      .btn-section .btn {
        margin-right: 1rem;
        min-width: 120px;
        font-weight: 500;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.05);
      }
      main.menu-container {
        display: flex;

        flex-wrap: wrap;
        gap: 20px;
        padding: -20px 20px;
      }

      .menu-button {
        background-color: white;
        border: none;
        padding: 20px 40px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: background-color 0.3s ease;
        text-decoration: none;
        color: black;
      }

      .menu-button.active {
  background-color: #0f2b52 !important;
  color: white !important;
  pointer-events: none;
}
.select-container {
  background-color: white;
  padding: 1.5rem;
  border-radius: 10px;
  margin-bottom: 2rem;
  box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.05);
}

.table tbody tr {
  background-color: white;
}
.table-header-custom {
  background-color: #e9ecef; /* Abu-abu Bootstrap */
  color: #212529;
}

.table tbody tr {
  background-color: white; /* Baris data presensi berwarna putih */
}

    </style>
  </head>
  <body>
    <header>
      <div class="logo">SIPEMA</div>

      <div class="user-section">
        <!-- Ikon user -->
        <div class="circle-icon">
          <img
            src="https://img.icons8.com/ios-filled/50/000000/user.png"
            alt="User"
          />
        </div>

        <div class="user-text">Mahasiswa</div>

        <div>/</div>
        <a href="../Login/login.html" class="logout-link">
          <div class="circle-icon">
            <img
              src="https://img.icons8.com/ios-filled/50/000000/logout-rounded.png"
              alt="Logout"
            />
          </div>
        </a>
      </div>
    </header>

    <!-- Konten -->
    <div class="content-container">
      <div class="info-card">
        <!-- Status Akademik di pojok kanan atas -->
        <div class="status-akademik">
          <h6 class="mb-1">Status Akademik</h6>
          <span class="badge-aktif">
            <i class="fas fa-check-circle"></i> Aktif
          </span>
        </div>

        <!-- Kiri -->
        <div class="info-left">
          <h6 class="fw-bold">Informasi Mahasiswa</h6>
          <p class="mb-1">NIM: 222222222</p>
          <p class="mb-1">Program Studi: Teknik Informatika (G-22)</p>
          <p class="mb-1">Semester: 1</p>
        </div>

        <!-- Kanan -->
        <div class="info-right">
          <p class="mb-1">Nama: John Doe</p>
          <p class="mb-1">Dosen Wali: John Anderson</p>
          <p class="mb-1">IPK: 4.00</p>
        </div>
      </div>

      <!-- Tombol Navigasi -->
      <main class="menu-container">
        <a href="Presensi.html" class="menu-button">Presensi</a>
        <a href="nilai.html" class="menu-button">Nilai</a>
        <a href="rekap_akademik.html" class="menu-button">Rekap Akademik</a>
      </main>
    </div>
  </body>
</html>

<div class="content-container">
    <div class="select-container">
      <!-- Pilih Tahun Akademik -->
      <div class="mb-4">
        <label for="tahunAkademik" class="form-label fw-bold">Tahun Akademik</label>
        <select class="form-select" id="tahunAkademik" onchange="tampilkanDataPresensi()">
          <option value="">-- Pilih Tahun --</option>
          <option value="2025/2026"> TA 2025/2025 Genap</option>
          <option value="2024/2025"> TA 2024/2025 Ganjil</option>
        </select>
      </div>
    </div>
  
    <!-- Tabel data presensi -->
    <!-- Tabel data presensi -->
<div id="tabelPresensi" class="select-container" style="display: none">
    <h5 class="fw-bold mb-3">Data Presensi</h5>
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="table-header-custom">
          <tr>
            <th>Mata Kuliah</th>
            <th>Total Pertemuan</th>
            <th>Hadir</th>
            <th>Persentase</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="isiTabelPresensi">
          <!-- Diisi oleh JavaScript -->
        </tbody>
      </table>
    </div>
  </div>
  
  

  <script>
    function tampilkanDataPresensi() {
      const tahun = document.getElementById("tahunAkademik").value;
      const isiTabel = document.getElementById("isiTabelPresensi");
      const divTabel = document.getElementById("tabelPresensi");
  
      isiTabel.innerHTML = ""; // kosongkan isi tabel
  
      if (!tahun) {
        divTabel.style.display = "none";
        return;
      }
  
      // Tampilkan tabel meskipun tidak ada data
      divTabel.style.display = "block";
    }
  
    // Deteksi halaman aktif
    const currentPage = window.location.pathname.split("/").pop();
    const menuButtons = document.querySelectorAll(".menu-button");
  
    menuButtons.forEach((button) => {
      if (button.getAttribute("href") === currentPage) {
        button.classList.add("active");
      }
    });
  </script>
  
  </body>
</html>
