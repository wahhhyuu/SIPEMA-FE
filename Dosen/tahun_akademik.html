<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>SIPEMA - Tahun Akademik</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #f8f9fa;
      }
      .navbar {
        background-color: #0f2b52;
        padding: 20px;
      }
      .navbar-brand {
        color: white;
        font-size: 28px;
        font-weight: bold;
      }
      .nav-btns .btn {
        border-radius: 10px;
        margin: 5px;
        font-weight: 600;
      }
      .nav-btns .btn.active {
        background-color: #0f2b52;
        color: white;
      }
      .dropdown-section {
        background-color: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        max-width: 1300px;
        margin: 40px auto;
      }
      label {
        font-weight: 600;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .form-select {
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
      }
      .user-info {
        color: white;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-info i {
        font-size: 24px;
      }
      main.menu-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 60px 20px;
      }

      .menu-button {
        background-color: white;
        border: none;
        padding: 20px 40px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: background-color 0.3s ease;
        text-decoration: none;
        color: black;
      }

      .menu-button:hover {
        background-color: #e0e0e0;
      }
      .menu-button.active {
        background-color: #0f2b52;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Header Navbar -->
    <div id="navbar-container"></div>
    <!-- Dropdown Tahun Akademik -->
    <div class="dropdown-section mt-4">
        <label for="tahunAkademik">Tahun Akademik</label>
        <select class="form-select" id="tahunAkademik" onchange="redirectTahun(this)">
          <option selected disabled>Pilih Tahun Akademik</option>
          <option value="pilih_tahun.html">TA 2024/2025 Genap</option>
          <option value="pilih_tahun.html">TA 2025/2026 Ganjil</option>
        </select>
      </div>
    <div id="presensiSection" style="display: none">
      <!-- Menu Navigasi -->
      <!-- Di dalam div #presensiSection -->
      <main class="menu-container">
        <a href="tahun_akademik.html" class="menu-button" onclick="setActiveMenu(this)">Presensi</a>
        <a href="pilih_tahun.html" class="menu-button" onclick="setActiveMenu(this)">Nilai Tugas</a>
        <a href="pilih_tahun.html" class="menu-button" onclick="setActiveMenu(this)">Nilai UTS</a>
        <a href="pilih_tahun.html" class="menu-button" onclick="setActiveMenu(this)">Nilai UAS</a>
        <a href="pilih_tahun.html" class="menu-button" onclick="setActiveMenu(this)">Rekap Nilai</a>
      </main>
      
  

      <!-- Konten Presensi -->
      <div class="content-box mt-3">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="mataKuliah">Mata Kuliah</label>
            <select id="mataKuliah" class="form-select">
              <option selected disabled>Pilih Mata Kuliah</option>
              <option>Layanan Web</option>
              <option>Sistem Oprasi</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="kelas">Kelas</label>
            <select id="kelas" class="form-select">
              <option selected disabled>Pilih Kelas</option>
              <option>Kelas A</option>
              <option>Kelas B</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="pertemuan">Pertemuan</label>
            <select id="pertemuan" class="form-select">
              <option selected disabled>Pilih Pertemuan</option>
              <option>Pertemuan 1</option>
              <option>Pertemuan 2</option>
              <option>Pertemuan 3</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="cari">Cari Mahasiswa</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                placeholder="Cari berdasarkan NIM atau Nama"
                id="cari"
              />
              <span class="input-group-text"><i class="bi bi-search"></i></span>
            </div>
          </div>
        </div>
        <div class="mt-4 text-center">
          <p><strong>Presensi:</strong> <span id="taInfo"></span></p>
        </div>
      </div>
    </div>

    <script>
      function tampilkanPresensi() {
        const tahun = document.getElementById("tahunAkademik").value;
        const semester = document.getElementById("semester").value;

        if (!tahun || !semester) {
          alert("Silakan pilih Tahun Akademik dan Semester terlebih dahulu.");
          return;
        }

        document.getElementById("presensiSection").style.display = "block";
        document.getElementById("taInfo").innerText =
          tahun + " - Semester " + semester;
      }

      function redirectTahun(selectObj) {
    const selectedValue = selectObj.value;
    if (selectedValue) {
      window.location.href = selectedValue;
    }
  }
    
  function redirectTahun(select) {
    const url = select.value;
    if (url) {
      window.location.href = url;
    }
  }

  function setActiveMenu(clickedButton) {
  const container = clickedButton.parentElement;
  const buttons = container.querySelectorAll('.menu-button');
  buttons.forEach(btn => btn.classList.remove('active'));
  clickedButton.classList.add('active');
}

        fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
          });
     

</script>

    </script>

    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </body>
</html>
