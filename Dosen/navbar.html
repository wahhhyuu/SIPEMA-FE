<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPEMA - Dosen</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background-color: #f9f9f9;
      }

      header {
        background-color: #0f2b52;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
      }

      .logo {
        font-size: 28px;
        font-weight: bold;
      }

      .user-section {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .circle-icon {
        width: 50px;
        height: 50px;
        background-color: #dce8f9;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .circle-icon img {
        width: 24px;
        height: 24px;
      }

      .user-text {
        font-size: 20px;
        font-weight: 500;
        color: #ffffff;
      }

      .divider {
        height: 40px;
        width: 2px;
        background-color: #dce8f9;
        transform: rotate(90deg);
      }

      .logout-link {
        text-decoration: none;
      }

      main.menu-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 60px 20px;
      }

      .menu-button {
        background-color: white;
        border: none;
        padding: 20px 40px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: background-color 0.3s ease;
        text-decoration: none;
        color: black;
      }

      .menu-button:hover {
        background-color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">SIPEMA</div>

      <div class="user-section">
        <!-- Ikon user -->
        <div class="circle-icon">
          <img
            src="https://img.icons8.com/ios-filled/50/000000/user.png"
            alt="User"
          />
        </div>

        <div class="user-text">Dosen</div>

        <div>/</div>
        <a href="../Login/login.html" class="logout-link">
          <div class="circle-icon">
            <img
              src="https://img.icons8.com/ios-filled/50/000000/logout-rounded.png"
              alt="Logout"
            />
          </div>
        </a>
      </div>
    </header>

    <main class="menu-container">
      <a href="tahun_presensi.html" class="menu-button">Presensi</a>
      <a href="tahun_akademik.html" class="menu-button">Nilai Tugas</a>
      <a href="tahun_akademik.html" class="menu-button">Nilai UTS</a>
      <a href="tahun_akademik.html" class="menu-button">Nilai UAS</a>
      <a href="tahun_akademik.html" class="menu-button">Rekap Nilai</a>
    </main>
  </body>
</html>
